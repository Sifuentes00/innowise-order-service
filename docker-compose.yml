services:
  app:
    build: .
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=${DB_URL}
      - DB_USERNAME=order_service_user
      - DB_PASSWORD=order_service_password
      - SERVER_PORT=${SERVER_PORT}
      - USER_SERVICE_URL=${DOCKER_USER_SERVICE_URL}
      - LIQUIBASE_ENABLED=${LIQUIBASE_ENABLED}
    depends_on:
      - postgres
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=innowise_order_service
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/create-db-user.sh:/docker-entrypoint-initdb.d/create-db-user.sh
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
